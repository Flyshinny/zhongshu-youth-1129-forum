<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>國小班・幼幼班 點名報到｜11/29 大會師</title>
<link rel="icon" href="icon.png">
<style>
:root{--navy:#1D4262;--amber:#E2922A;--green:#2E6B55;--ink:#1F2F3D;--sub:#5B6A76;--ok:#2e8b57;--yy:#C9663A;--gs:#1D4262}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#eef2f2;color:var(--ink);-webkit-tap-highlight-color:transparent}
header{background:var(--hd);color:#fff;padding:12px 14px 12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.t1{font-size:14px;opacity:.85;letter-spacing:1px}
.t2{display:flex;align-items:center;gap:10px;margin-top:2px}
.t2 h1{margin:0;font-size:22px;letter-spacing:2px;flex:1}
.cnt{font-size:15px;background:rgba(255,255,255,.18);border-radius:12px;padding:4px 12px;white-space:nowrap}
.cnt b{font-size:26px}
.tabs{display:flex;gap:8px;margin-top:10px}
.tabs a{flex:1;text-align:center;padding:9px 4px;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:17px;text-decoration:none}
.tabs a.on{background:#fff;color:var(--hd)}
.tabs a small{font-weight:600;font-size:13px;opacity:.85;margin-left:4px}
.bar{display:flex;gap:8px;margin-top:10px}
.bar input{flex:1;min-width:0;font:inherit;font-size:17px;padding:8px 12px;border:0;border-radius:10px;outline:none}
.flt{display:flex;background:rgba(255,255,255,.16);border-radius:10px;overflow:hidden}
.flt a{padding:8px 11px;color:#fff;font-size:15px;font-weight:700;text-decoration:none}
.flt a.on{background:#fff;color:var(--hd)}
main{padding:10px 10px 120px;max-width:760px;margin:0 auto}
.test{background:#fff3cd;color:#7a5a00;text-align:center;font-weight:800;padding:6px;border-radius:10px;margin-bottom:8px}
h2{margin:16px 4px 6px;font-size:16px;color:var(--sub);display:flex;justify-content:space-between}
h2 span{font-weight:600}
.k{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid #fff;border-radius:14px;padding:12px 14px;margin:0 0 8px;box-shadow:0 1px 4px rgba(29,66,98,.12);cursor:pointer}
.k:active{transform:scale(.99)}
.k .bx{width:34px;height:34px;flex:none;border-radius:50%;border:3px solid #b8c2ca;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff}
.k .nm{font-size:22px;font-weight:900;letter-spacing:2px}
.k .sb{font-size:14px;color:var(--sub);margin-top:2px}
.k .mid{flex:1;min-width:0}
.k .st{font-size:15px;font-weight:800;color:#9aa6af;white-space:nowrap}
.k.on{background:#e9f6ee;border-color:#9fd3b2}
.k.on .bx{background:var(--ok);border-color:var(--ok)}
.k.on .st{color:var(--ok)}
.k.wait{opacity:.6}
.k.wait .bx{border-style:dashed}
.tg{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--amber);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:3px;letter-spacing:0}
.tg.t{background:var(--green)}
.empty{text-align:center;color:var(--sub);padding:30px 0}
.fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--amber);color:#fff;border:0;border-radius:30px;font:inherit;font-weight:900;font-size:17px;padding:13px 20px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:rgba(20,30,40,.92);color:#fff;padding:10px 18px;border-radius:12px;font-size:16px;font-weight:700;display:none;z-index:20;max-width:90%;text-align:center}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.dlg{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:420px}
.dlg h3{margin:0 0 12px;font-size:20px;color:var(--navy)}
.dlg p{font-size:18px;margin:0 0 16px}
.dlg label{display:block;font-size:15px;font-weight:700;color:var(--sub);margin:10px 0 4px}
.dlg input,.dlg select{width:100%;font:inherit;font-size:18px;padding:9px 10px;border:2px solid #c9d3da;border-radius:10px}
.btns{display:flex;gap:10px;margin-top:18px}
.btns button{flex:1;font:inherit;font-weight:900;font-size:18px;padding:12px;border-radius:12px;border:0}
.btns .no{background:#e6ebee;color:var(--ink)}
.btns .yes{background:var(--hd);color:#fff}
.btns .red{background:#c0392b;color:#fff}
.sync{font-size:12px;opacity:.75;margin-left:6px}
.msg{padding:40px 20px;text-align:center;font-size:18px;color:var(--sub)}
</style></head><body>
<header id="hd">
  <div class="t1">11/29 忠恕青年大會師<span class="sync" id="sync"></span></div>
  <div class="t2"><h1 id="ttl">點名報到</h1><div class="cnt" id="cnt"></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="bar"><input id="q" placeholder="搜尋姓名、單位、家長" autocomplete="off">
    <div class="flt" id="flt"><a data-f="all" class="on">全部</a><a data-f="no">未到</a><a data-f="yes">已到</a></div></div>
</header>
<main id="main"><div class="msg">載入名單中…</div></main>
<button class="fab" id="add">＋ 臨時加入</button>
<div class="toast" id="toast"></div>
<div class="mask" id="mask"><div class="dlg" id="dlg"></div></div>
<script>
(function(){
  var GAS = "https://script.google.com/macros/s/AKfycbzOuOQhiTAeQQUUeCzT0Ze0qCdCrCwGMckL9XiDljPgSxCSvUHuRdCBXRFL-fKpfZ4/exec";
  var qs = new URLSearchParams(location.search), hs = new URLSearchParams(location.hash.slice(1));
  var K = hs.get("k") || "", TEST = qs.get("test") === "1", MOCK = qs.get("mock") === "1";
  var FIX = qs.get("c");                         // ?c=yy 只看幼幼班、?c=gs 只看國小班
  var NAMES = {yy:"幼幼班", gs:"國小班"}, COLOR = {yy:"#C9663A", gs:"#1D4262"};
  var R = null, ST = {}, PEND = {}, cls = FIX && NAMES[FIX] ? FIX : (localStorage.getItem("kidsCls") || "yy"), flt = "all", q = "";
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function toast(t, ms){ var e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(function(){ e.style.display = "none"; }, ms || 2200); }
  function hhmm(){ var d = new Date(); return ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2); }

  // ---- 後端 ----
  var mockSt = JSON.parse(localStorage.getItem("kidsMock") || "{}");
  function apiGet(){
    if (MOCK) return fetch("roster.json").then(function(r){ return r.json(); }).then(function(r){ return {ok:true, now:hhmm(), roster:r, st:mockSt}; });
    return fetch(GAS + "?action=kids&k=" + encodeURIComponent(K) + (TEST ? "&test=1" : "")).then(function(r){ return r.json(); });
  }
  function apiPost(d){
    if (MOCK) return new Promise(function(ok){ setTimeout(function(){ mockSt[d.id] = [d.on?1:0, hhmm(), d.name, d.unit, NAMES[d.cls], d.role]; localStorage.setItem("kidsMock", JSON.stringify(mockSt)); ok({ok:true, time:hhmm()}); }, 400); });
    d.action = "kid"; d.k = K; d.test = TEST;
    return fetch(GAS, {method:"POST", body: JSON.stringify(d)}).then(function(r){ return r.json(); });
  }

  // ---- 名單（名冊＋臨時加入）----
  function people(c){
    var out = [];
    R[c].kids.forEach(function(p){ out.push({id:p.id, n:p.n, u:p.u, role:"學員", sb:[p.s, p.a ? (/^\d+$/.test(p.a) ? p.a + "歲" : p.a) : "", p.g].filter(Boolean).join(" ") + (p.p ? "　家長 " + p.p + (p.r ? "（" + p.r + "）" : "") : "")}); });
    Object.keys(ST).forEach(function(id){
      var s = ST[id];
      if (id.indexOf(c + "X") === 0 && (s[0] || PEND[id])) out.push({id:id, n:s[2], u:s[3], role:"學員", sb:"臨時加入", x:1});
    });
    var t = R[c].tch.map(function(p){ return {id:p.id, n:p.n, u:"", role:"師資", sb:p.note || "", t:1}; });
    Object.keys(ST).forEach(function(id){ var s = ST[id]; if (id.indexOf(c + "Y") === 0 && (s[0] || PEND[id])) t.push({id:id, n:s[2], u:s[3], role:"師資", sb:"臨時加入", t:1, x:1}); });
    return {k:out, t:t};
  }
  function on(id){ return PEND[id] ? PEND[id].on : !!(ST[id] && ST[id][0]); }
  function count(c){ var p = people(c), n = 0; p.k.forEach(function(x){ if (on(x.id)) n++; }); return [n, p.k.length]; }

  function render(){
    if (!R) return;
    document.documentElement.style.setProperty("--hd", COLOR[cls]);
    $("ttl").textContent = NAMES[cls] + " 點名";
    var c = count(cls), tc = 0, P = people(cls);
    P.t.forEach(function(x){ if (on(x.id)) tc++; });
    $("cnt").innerHTML = "學員 <b>" + c[0] + "</b>／" + c[1] + (P.t.length ? "　師資 " + tc + "／" + P.t.length : "");
    $("tabs").innerHTML = FIX ? "" : ["yy","gs"].map(function(k){ var n = count(k); return '<a data-c="' + k + '" class="' + (k === cls ? "on" : "") + '">' + NAMES[k] + '<small>' + n[0] + "/" + n[1] + "</small></a>"; }).join("");
    var h = TEST ? '<div class="test">測試模式：資料寫進「幼幼班・國小班報到（測試）」</div>' : "";
    function pass(x){
      if (flt === "yes" && !on(x.id)) return false;
      if (flt === "no" && on(x.id)) return false;
      return !q || (x.n + x.u + x.sb).indexOf(q) >= 0;
    }
    function card(x){
      var o = on(x.id), s = ST[x.id], tm = PEND[x.id] ? "傳送中…" : o ? "✓ " + (s ? s[1] : "") : "未到";
      return '<button class="k' + (o ? " on" : "") + (PEND[x.id] ? " wait" : "") + '" data-id="' + x.id + '"><div class="bx">' + (o ? "✓" : "") + '</div><div class="mid"><div class="nm">' + esc(x.n) +
        (x.x ? '<span class="tg">臨時</span>' : "") + '</div><div class="sb">' + esc((x.t && x.u ? x.u + "　" : "") + x.sb) + '</div></div><div class="st">' + tm + "</div></button>";
    }
    var groups = [], gi = {};
    P.k.forEach(function(x){ if (!(x.u in gi)) { gi[x.u] = groups.length; groups.push({u:x.u, a:[]}); } groups[gi[x.u]].a.push(x); });
    var shown = 0;
    groups.forEach(function(g){
      var a = g.a.filter(pass); if (!a.length) return;
      var n = g.a.filter(function(x){ return on(x.id); }).length;
      h += "<h2>" + esc(g.u || "未填單位") + "<span>" + n + "／" + g.a.length + "</span></h2>" + a.map(card).join(""); shown += a.length;
    });
    var ta = P.t.filter(pass);
    if (ta.length) { h += "<h2>" + NAMES[cls] + "師資<span>" + tc + "／" + P.t.length + "</span></h2>" + ta.map(card).join(""); shown += ta.length; }
    if (!shown) h += '<div class="empty">' + (q ? "找不到「" + esc(q) + "」" : flt === "no" ? "🎉 全部到齊了！" : "沒有資料") + "</div>";
    $("main").innerHTML = h;
  }

  function find(id){ var P = people(id.slice(0,2)); return P.k.concat(P.t).filter(function(x){ return x.id === id; })[0]; }
  function send(x, val, tries){
    PEND[x.id] = {on:val}; render();
    apiPost({id:x.id, on:val, cls:x.id.slice(0,2), name:x.n, unit:x.u, role:x.role, note:x.x ? "臨時加入" : ""}).then(function(r){
      if (r.ok) { ST[x.id] = [val?1:0, r.time, x.n, x.u, NAMES[x.id.slice(0,2)], x.role]; delete PEND[x.id]; render(); toast((val ? "✓ " + x.n + " 已報到" : x.n + (x.x ? " 已取消並移出名單" : " 已取消報到"))); }
      else if (r.msg === "busy" && (tries||0) < 4) setTimeout(function(){ send(x, val, (tries||0)+1); }, 1500);
      else { delete PEND[x.id]; render(); toast(r.msg === "key" ? "密碼錯誤，請用班導師連結開啟" : "沒有送出，請再按一次", 3500); }
    }).catch(function(){
      if ((tries||0) < 4) setTimeout(function(){ send(x, val, (tries||0)+1); }, 2000);
      else { delete PEND[x.id]; render(); toast("網路不穩，沒有送出，請再按一次", 3500); }
    });
  }
  function dlg(html){ $("dlg").innerHTML = html; $("mask").style.display = "flex"; }
  function close(){ $("mask").style.display = "none"; }
  $("mask").addEventListener("click", function(e){ if (e.target === this) close(); });

  $("main").addEventListener("click", function(e){
    var b = e.target.closest(".k"); if (!b) return;
    var x = find(b.dataset.id); if (!x || PEND[x.id]) return;
    if (!on(x.id)) return send(x, true);
    dlg("<h3>取消報到？</h3><p>確定要把 <b>" + esc(x.n) + "</b> 改回「未到」嗎？</p><div class='btns'><button class='no'>不要</button><button class='red'>取消報到</button></div>");
    $("dlg").querySelector(".no").onclick = close;
    $("dlg").querySelector(".red").onclick = function(){ close(); send(x, false); };
  });
  $("tabs").addEventListener("click", function(e){ var a = e.target.closest("a"); if (!a) return; cls = a.dataset.c; localStorage.setItem("kidsCls", cls); render(); scrollTo(0,0); });
  $("flt").addEventListener("click", function(e){ var a = e.target.closest("a"); if (!a) return; flt = a.dataset.f; [].forEach.call(this.children, function(c){ c.classList.toggle("on", c === a); }); render(); });
  $("q").addEventListener("input", function(){ q = this.value.trim(); render(); });
  $("add").onclick = function(){
    var units = []; R[cls].kids.forEach(function(p){ if (p.u && units.indexOf(p.u) < 0) units.push(p.u); });
    dlg("<h3>臨時加入（" + NAMES[cls] + "）</h3><label>姓名</label><input id='an' autocomplete='off'><label>單位</label><input id='au' list='ul' autocomplete='off'><datalist id='ul'>" +
      units.map(function(u){ return "<option value='" + esc(u) + "'>"; }).join("") + "</datalist><label>身分</label><select id='ar'><option>學員</option><option>師資</option></select>" +
      "<div class='btns'><button class='no'>取消</button><button class='yes'>加入並報到</button></div>");
    $("an").focus();
    $("dlg").querySelector(".no").onclick = close;
    $("dlg").querySelector(".yes").onclick = function(){
      var n = $("an").value.trim(), u = $("au").value.trim(), t = $("ar").value === "師資";
      if (n.length < 2) return toast("請輸入姓名");
      var dup = people(cls); dup = dup.k.concat(dup.t).filter(function(x){ return x.n === n; })[0];
      if (dup) { close(); toast("「" + n + "」已在名單上，直接點名字即可"); $("q").value = q = n; return render(); }
      var x = {id: cls + (t ? "Y" : "X") + Date.now().toString(36), n:n, u:u, role:t ? "師資" : "學員", x:1, t:t ? 1 : 0, sb:"臨時加入"};
      ST[x.id] = [0, "", n, u, NAMES[cls], x.role];
      close(); send(x, true);
    };
  };

  function load(first){
    apiGet().then(function(r){
      if (!r.ok) { $("main").innerHTML = '<div class="msg">' + (r.msg === "key" ? "🔒 請用班導師專用連結開啟" : "讀取失敗") + "</div>"; $("add").style.display = "none"; return; }
      R = r.roster; ST = r.st || {}; $("sync").textContent = "・" + r.now + " 更新"; render();
    }).catch(function(){ if (first) $("main").innerHTML = '<div class="msg">連不上報到服務，請檢查網路後重新整理</div>'; $("sync").textContent = "・連線中斷"; });
  }
  if (!MOCK && !/^https:/.test(GAS)) { $("main").innerHTML = '<div class="msg">報到服務尚未設定</div>'; return; }
  if (!MOCK && !K) { $("main").innerHTML = '<div class="msg">🔒 請用班導師專用連結開啟</div>'; $("add").style.display = "none"; return; }
  load(true);
  setInterval(function(){ if (!Object.keys(PEND).length && $("mask").style.display !== "flex") load(); }, 20000);   // 多位老師同時點名會互相同步
})();
</script>
</body></html>
