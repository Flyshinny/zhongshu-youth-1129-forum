<html lang="zh-Hant">
<head>

<title>忠恕青年大會師｜論壇分組查詢</title>
<meta property="og:title" content="忠恕青年大會師｜論壇分組查詢">
<meta property="og:description" content="輸入名字，馬上找到你的論壇樓層和組別（11/29）">
<meta property="og:image" content="https://flyshinny.github.io/zhongshu-youth-1129-forum/cover.jpg">

<link rel="apple-touch-icon" href="icon.png">

<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#1f2d3d; --sub:#6b5b45; --line:#e4dccb;
  --blue:#4a7fc1; --blue-bg:#e3edf8; --pink:#d9708a; --pink-bg:#fbe7ec; --green:#4f9a6b; --green-bg:#e3f2e8;
  --accent:#b0573a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-text-size-adjust:100%;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom))}
header{text-align:center;padding:8px 0 14px}
header .ev{font-size:15px;color:var(--sub);letter-spacing:1px}
header h1{font-size:30px;margin:4px 0 0;letter-spacing:2px}
.floors{display:flex;gap:5px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.floors span{font-size:12px;padding:4px 8px;border-radius:999px;color:#fff;font-weight:600}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:#ebe3d3;border-radius:14px;padding:4px;margin:10px 0 16px}
.tabs button{border:0;background:transparent;font:inherit;font-size:17px;font-weight:700;color:var(--sub);padding:11px 0;border-radius:11px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.search{position:relative}
.search input{width:100%;font:inherit;font-size:22px;padding:16px 48px 16px 18px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--ink)}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:#ebe3d3;color:var(--sub);font-size:20px;display:none;cursor:pointer}
.hint{color:var(--sub);font-size:15px;margin:12px 4px;line-height:1.6}
.hint b{color:var(--ink)}

.res{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(60,40,10,.08);border-left:10px solid var(--c)}
.card .top{display:flex;align-items:baseline;gap:8px;padding:14px 16px 0;flex-wrap:wrap}
.card .nm{font-size:26px;font-weight:800;letter-spacing:1px}
.card .nm mark{background:#ffe86b;color:inherit;border-radius:3px;padding:0 1px}
.card .unit{font-size:16px;color:var(--sub)}
.card .lead{font-size:13px;font-weight:700;background:#ffe86b;color:#5a4500;padding:3px 9px;border-radius:999px;align-self:center}
.card .where{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:12px 16px 16px;padding:12px 14px;border-radius:14px;background:var(--cb)}
.card .fl{font-size:34px;font-weight:900;color:var(--c);line-height:1;white-space:nowrap}
.card .gp{font-size:34px;font-weight:900;line-height:1;white-space:nowrap}
.card .gp small{font-size:18px;font-weight:700}
.card .fm{flex-basis:100%;font-size:15px;color:var(--sub);line-height:1.4;border-top:1px dashed rgba(0,0,0,.12);padding-top:8px}
.card .fm b{font-size:16px;color:var(--ink);margin-right:6px}
.blue{color:#2346c7}.red{color:#d0342c}
.more,.none{background:var(--card);border-radius:16px;padding:16px;color:var(--sub);font-size:16px;line-height:1.7;text-align:center}
.none b{color:var(--ink)}
.sug{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sug button{font:inherit;font-size:17px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink)}

#scan{display:none;text-align:center}
.qrbox{background:var(--card);border-radius:20px;padding:22px 18px;box-shadow:0 2px 10px rgba(60,40,10,.08)}
.qrbox img{width:min(78vw,300px);height:auto;border-radius:10px;image-rendering:pixelated}
.qrbox h2{font-size:21px;margin:0 0 6px}
.qrbox p{color:var(--sub);font-size:15px;line-height:1.7;margin:10px 0 0}
.steps{display:flex;justify-content:center;gap:6px;margin:16px 0 4px;font-size:15px;font-weight:700;flex-wrap:wrap}
.steps span{background:#ebe3d3;border-radius:10px;padding:6px 10px}
.copy{margin-top:14px;font:inherit;font-size:16px;font-weight:700;border:0;background:var(--ink);color:#fff;border-radius:12px;padding:12px 20px;cursor:pointer}
footer{text-align:center;color:#a39478;font-size:13px;margin-top:26px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ev">忠恕青年大會師・11/29（日）</div>
    <h1>論壇分組查詢</h1>
    <div class="floors">
      <span style="background:var(--blue)">高峰論壇・四樓</span>
      <span style="background:var(--pink)">人才論壇・五樓</span>
      <span style="background:var(--green)">開創論壇・六樓</span>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button id="tIn" class="on" role="tab">⌨️ 輸入名字</button>
    <button id="tQr" role="tab">📷 掃描 QR</button>
  </div>

  <section id="find">
    <div class="search">
      <input id="q" type="search" placeholder="輸入你的名字" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="輸入名字">
      <button class="clr" id="clr" aria-label="清除">×</button>
    </div>
    <div class="hint" id="hint">請輸入<b>完整名字</b>（至少 2 個字），就會顯示你的<b>論壇、樓層和組別</b>。</div>
    <div class="res" id="res"></div>
  </section>

  <section id="scan">
    <div class="qrbox">

  var F = D.f, P = D.p;

  function card(p, key){
    var f = F[p[2]], c = COL[f.c], lead = p[4]&1, blue = p[4]&2, red = p[4]&4;
    var nm = p[0], i = key ? p.k.indexOf(key) : -1, nmH;
    nmH = i>=0 ? esc(nm.slice(0,i))+"<mark>"+esc(nm.slice(i,i+key.length))+"</mark>"+esc(nm.slice(i+key.length)) : esc(nm);
    var work = p[3]==="工作組";
    var gp = work ? "<div class='gp'>工作組</div>" : "<div class='gp'><small>第</small> "+p[3]+" <small>組</small></div>";
    return "<div class='card' style='--c:"+c[0]+";--cb:"+c[1]+"'>"+
      "<div class='top'><span class='nm"+(blue?" blue":"")+"'>"+nmH+"</span><span class='unit"+(red?" red":"")+"'>"+esc(p[1])+"</span>"+(lead?"<span class='lead'>組長</span>":"")+"</div>"+
      "<div class='where'><div class='fl'>"+f.f+"</div>"+gp+"<div class='fm'><b>"+f.n+"</b>"+f.t+"</div></div></div>";
  }

  function run(){
    var raw = q.value, key = norm(raw);
    clr.style.display = raw ? "block" : "none";
    if (key.length < 2){ res.innerHTML = ""; hint.style.display = "block"; return; }
    hint.style.display = "none";
    var hit = P.filter(function(p){ return p.k.indexOf(key) >= 0; });
    // 完全相符的排前面
    hit.sort(function(a,b){ return (b.k===key)-(a.k===key); });
    if (hit.length > 8 && !hit.some(function(p){return p.k===key;})){

    }
    if (hit.length > 8) hit = hit.filter(function(p){ return p.k===key; });
    if (hit.length){
      var h = hit.map(function(p){ return card(p, key); }).join("");
      if (hit.length > 1 && hit.every(function(p){return p.k===key;})) h = "<div class='hint' style='margin:0 4px'>有 "+hit.length+" 位同名，請看單位找自己：</div>" + h;
      res.innerHTML = h; return;
    }
    // 找不到：猜可能打錯一個字（同長度、只差一個字）
    var sug = [];
    if (key.length >= 3){
      P.forEach(function(p){
        if (p.k.length !== key.length) return;
        var d = 0; for (var i=0;i<key.length;i++) if (p.k[i]!==key[i]) d++;
        if (d === 1 && sug.indexOf(p[0])<0) sug.push(p[0]);
      });
    }
    res.innerHTML = "<div class='none'>找不到「<b>"+esc(raw)+"</b>」<br>請確認名字的字有沒有打錯"+
