.serif{font-family:S,"Noto Serif TC","Songti TC",serif;font-weight:900}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:14px 16px 0;flex:1}
header{text-align:center;position:relative}
.logo{display:block;width:132px;margin:0 0 0 auto}
.title{display:block;width:min(86%,400px);margin:-6px auto 0}
.pill{display:inline-block;margin-top:8px;background:var(--amber);color:#fff;border-radius:999px;padding:6px 26px 8px;font-size:25px;letter-spacing:5px;
  box-shadow:0 4px 12px rgba(120,70,10,.22);white-space:nowrap}
.pill small{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-weight:800;font-size:15px;letter-spacing:1px;margin-left:6px;vertical-align:3px}
.floors{display:flex;gap:6px;justify-content:center;margin:14px 0 2px;flex-wrap:wrap}
.floors span{font-size:13px;padding:4px 10px;border-radius:999px;color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(29,66,98,.18)}

.panel{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:22px;box-shadow:0 8px 26px rgba(29,66,98,.16);
  margin-top:14px;overflow:hidden}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--navy)}
.tabs button{border:0;background:transparent;font:inherit;font-size:17px;font-weight:800;color:rgba(255,255,255,.7);padding:14px 0 13px;cursor:pointer;position:relative}
.tabs button.on{color:#fff}
.tabs button.on::after{content:"";position:absolute;left:28%;right:28%;bottom:0;height:4px;border-radius:4px 4px 0 0;background:var(--amber)}
.body{padding:16px}

.search{position:relative}
.search input{width:100%;font:inherit;font-size:22px;font-weight:700;padding:15px 50px 15px 18px;border:2.5px solid rgba(29,66,98,.25);border-radius:16px;background:#fff;color:var(--ink);outline:none;-webkit-appearance:none}
.search input::placeholder{color:#9aa6b0;font-weight:500}
.search input:focus{border-color:var(--navy)}
.search .clr{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:#e8edf1;color:var(--sub);font-size:20px;display:none;cursor:pointer}
.hint{color:var(--sub);font-size:15px;margin:12px 2px 2px;line-height:1.7}
.hint b{color:var(--navy)}

.res{display:flex;flex-direction:column;gap:12px}
.res:not(:empty){margin-top:14px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(29,66,98,.12)}
.card .ch{background:var(--c);color:#fff;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:9px 16px 10px}
.card .ch b{font-size:20px;letter-spacing:2px}
.card .ch span{font-size:13px;font-weight:700;opacity:.9}
.card .who{display:flex;align-items:center;gap:10px;padding:14px 16px 0;flex-wrap:wrap}
.card .nm{font-size:27px;font-weight:900;letter-spacing:1px}
.card .nm mark{background:linear-gradient(transparent 55%,#ffd98a 55%);color:inherit}
.card .unit{font-size:16px;color:var(--sub);font-weight:700}
.card .lead{font-size:14px;font-weight:800;background:var(--cream);border:2px solid var(--amber);color:var(--brown);padding:1px 10px 2px;border-radius:999px}
.card .where{display:flex;align-items:center;gap:0;margin:12px 16px 16px;border-radius:14px;background:var(--cb);overflow:hidden}
.card .where div{flex:1;text-align:center;padding:12px 4px 13px}
.card .where div+div{border-left:2px dashed rgba(0,0,0,.1)}
.card .where small{display:block;font-size:13px;color:var(--sub);font-weight:700;margin-bottom:2px}
.card .where .serif{font-size:38px;color:var(--c);line-height:1.1}
.card .where .serif i{font-style:normal;font-size:20px}
.blue{color:#2346c7}.red{color:#d0342c}
.ck{display:block;width:calc(100% - 32px);margin:-4px 16px 16px;font:inherit;font-size:20px;font-weight:900;letter-spacing:2px;border:0;border-radius:14px;
  padding:13px 0 14px;background:var(--amber);color:#fff;cursor:pointer;box-shadow:0 4px 0 #b86f12;text-align:center}
.ck:active{transform:translateY(2px);box-shadow:0 2px 0 #b86f12}
.ck:disabled{opacity:.7}
.gd{margin:-6px 16px 16px;border-radius:14px;background:#fff7e8;border:2px solid var(--amber);padding:11px 14px 12px;text-align:center}
.gd1{font-size:14px;font-weight:800;color:var(--brown)}
.gd2{font-size:24px;font-weight:900;color:var(--navy);margin:2px 0 4px;line-height:1.3}
.gd3{font-size:15px;color:var(--ink);font-weight:700;line-height:1.5}
.gd4{font-size:14px;color:var(--sub);margin-top:6px;padding-top:6px;border-top:1px dashed rgba(138,84,16,.3)}
.ck.pm{background:var(--green);box-shadow:0 4px 0 #1d4a3a}
.ck.done.small{font-size:15px;padding:6px 0 7px;margin-bottom:8px;opacity:.8}
.ck.done{background:#e3f3e6;color:#24734a;box-shadow:none;border:2px solid #7cc596;font-size:19px;padding:11px 0 12px}
.seat{margin:-6px 16px 16px;border-radius:14px;background:#fbfaf6;border:2px solid #c9d3e0;padding:10px 8px 8px;text-align:center}
.seat h4{margin:0 0 2px;font-size:17px;font-weight:900;color:var(--navy)}
.seat p{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--brown);line-height:1.5}
.seat svg{width:100%;height:auto;display:block}
.seat .hl{animation:hl 1.1s ease-in-out infinite}
@keyframes hl{50%{stroke-opacity:.25}}
.more,.none{background:#fff;border-radius:16px;padding:16px;color:var(--sub);font-size:16px;line-height:1.7;text-align:center}
.none b,.more b{color:var(--navy)}
.multi{color:var(--brown);font-weight:700;font-size:15px;margin:0 2px}
.sug{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sug button{font:inherit;font-size:17px;font-weight:700;border:2px solid var(--amber);background:var(--cream);color:var(--brown);border-radius:999px;padding:5px 14px;cursor:pointer}

#scan{display:none;text-align:center}
#scan h2{font-size:21px;margin:2px 0 4px;color:var(--navy);letter-spacing:1px}
.steps{display:flex;justify-content:center;gap:6px;margin:10px 0 12px;font-size:14px;font-weight:800;flex-wrap:wrap}
.steps span{background:var(--cream);color:var(--brown);border:1.5px solid var(--amber);border-radius:999px;padding:3px 10px}
.qr{display:inline-block;background:#fff;padding:10px;border-radius:14px;box-shadow:0 4px 14px rgba(29,66,98,.14)}
.qr img{display:block;width:min(66vw,260px);height:auto;image-rendering:pixelated}
#scan p{color:var(--sub);font-size:15px;line-height:1.7;margin:12px 0 0}
.line{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:17px;font-weight:800;text-decoration:none;background:#06C755;color:#fff;border-radius:999px;padding:11px 26px 11px 18px;box-shadow:0 4px 12px rgba(6,120,60,.25)}
.line svg{width:26px;height:26px}

.note{text-align:center;color:var(--sub);font-size:13px;margin:16px 0 0;line-height:1.7;font-weight:600}
.hits{position:absolute;left:0;top:2px;display:flex;align-items:center;gap:5px;padding:4px 10px 5px;border-radius:999px;
  background:rgba(29,66,98,.88);color:#fff;font-size:12px;font-weight:700;letter-spacing:.3px;box-shadow:0 2px 8px rgba(29,66,98,.2)}
.hits img{display:block;height:18px;border-radius:3px}

    if (dt) u = "點傳師";
    var mine = SEAT8.filter(function(b){ return b[0]===u && (!g || !b[1] || b[1]===g); });
    if (!mine.length) return "";
    var o = "<svg viewBox='340 430 920 1110' xmlns='http://www.w3.org/2000/svg'>";
    o += "<path d='M505 446H1095V508H990Q800 590 610 508H505Z' fill='#21455f'/>"+svgT(800,496,"舞　台",34,"#fff",900);
    o += "<rect x='365' y='446' width='67' height='66' fill='#21455f'/>"+svgT(398,479,"坤",34,"#fff",900);
    o += "<rect x='1172' y='446' width='68' height='66' fill='#21455f'/>"+svgT(1206,479,"乾",34,"#fff",900);
    var top = "";
    SEAT8.forEach(function(b){
      var on = mine.indexOf(b) >= 0, nm = (SEAT_NAME[b[0]]||b[0]) + (b[0]==="點傳師" ? "" : b[1] ? "（"+(b[1]==="q"?"乾":"坤")+"）" : "（乾/坤）");
      var r = "<rect x='"+b[2]+"' y='"+b[3]+"' width='"+b[4]+"' height='"+b[5]+"' fill='"+(on?"#ffd23f":b[6]?"#9199b1":"#d5d5dd")+"' stroke='#fbfaf6' stroke-width='3' opacity='"+(on?1:.55)+"'/>";
      var t = svgT(b[2]+b[4]/2, b[3]+b[5]/2, nm, b[5] < 40 ? 21 : 25, on?"#7a1d12":"#2b3346", on?900:700);
      if (on) top += r + "<rect class='hl' x='"+(b[2]-6)+"' y='"+(b[3]-6)+"' width='"+(b[4]+12)+"' height='"+(b[5]+12)+"' rx='10' fill='none' stroke='#e53935' stroke-width='10'/>" + t;
      else o += r + t;
    });
    o += top + "</svg>";
    var tip = mine.length > 1 ? "乾道坐「"+(SEAT_NAME[u]||u)+"（乾）」、坤道坐「"+(SEAT_NAME[u]||u)+"（坤）」" : "請到紅框「"+(SEAT_NAME[u]||u)+(u==="點傳師"?"":mine[0][1]?"（"+(mine[0][1]==="q"?"乾":"坤")+"）":"")+"」入座";
    return "<div class='seat'><h4>🪑 8 樓主場・你的座位區</h4><p>"+tip+"</p>"+o+"</div>";
  }
  // ---- 論壇樓層圖（座標取自各論壇分組圖 1600×2000）----
  var GX = [426,541,741,857,1067,1182], GY = [800,899,998,1097,1196,1294,1393];
  var GRID = [[1,2,3,4,5,6],[12,11,10,9,8,7],[13,14,15,16,17,18],[24,23,22,21,20,19],[25,"3-3",26,27,28,29],[35,34,33,32,31,30]];
  function gridPts(last){ var a = []; GRID.concat([last]).forEach(function(row, r){ row.forEach(function(v, c){ if (v!=="") a.push([String(v), GX[c], GY[r]]); }); }); return a; }
  var FMAP = [
    [["1",741,747],["2",857,747],["3",1067,796],["4",1182,796],["8",741,846],["7",857,846],["6",1067,895],["5",1182,895],["9",741,944],["10",857,944],
     ["11",645,1009],["14",954,1009],["15",1067,993],["12",741,1043],["13",857,1043],["16",1067,1092],["19",741,1142],["18",857,1142],["20",645,1171],["17",954,1171],
     ["23",1067,1191],["24",1182,1191],["21",741,1241],["22",857,1241],["26",1067,1290],["25",1182,1290],["30",645,1334],["29",741,1339],["28",857,1339],["27",954,1334],
     ["33",1067,1388],["34",1182,1388],["31",741,1438],["32",857,1438],["工作",741,1537],["工作",857,1537]],
    gridPts(["","","工作","工作","",""]),
    gridPts(["",36,37,38,"工作",""])
  ];
  var PILLAR = {0:[[645,768],[954,768],[645,929],[954,929],[645,1091],[954,1091],[645,1252],[954,1252],[645,1414],[954,1414]]};
  function forumMapHTML(p){
    var pts = FMAP[p[2]], f = F[p[2]], work = p[3]==="工作組", key = work ? "工作" : String(p[3]);
    if (!pts || !pts.some(function(q){ return q[0]===key; })) return "";
    var o = "<svg viewBox='340 560 920 "+(p[2]===0?1030:1020)+"' xmlns='http://www.w3.org/2000/svg'>";
    o += "<rect x='355' y='568' width='142' height='88' fill='#f7c9dc'/>"+svgT(426,595,"坤道",30,"#222",700)+svgT(426,632,"樓梯",30,"#222",700);
    o += "<rect x='497' y='568' width='606' height='88' fill='#c8c8c8'/>"+svgT(800,612,"↑ 母堂方向",32,"#222",700);
    o += "<rect x='1103' y='568' width='142' height='88' fill='#bfe3f7'/>"+svgT(1174,595,"乾道",30,"#222",700)+svgT(1174,632,"樓梯",30,"#222",700);
    var ey = p[2]===0 ? 1476 : 1480;
    o += "<rect x='355' y='"+ey+"' width='142' height='88' fill='#f7c9dc'/>"+svgT(426,ey+27,"坤道",30,"#222",700)+svgT(426,ey+64,"電梯",30,"#222",700);
    o += "<rect x='1103' y='"+ey+"' width='142' height='88' fill='#bfe3f7'/>"+svgT(1174,ey+27,"乾道",30,"#222",700)+svgT(1174,ey+64,"電梯",30,"#222",700);
    (PILLAR[p[2]] || [[645,772],[954,772],[645,934],[954,934],[645,1096],[954,1096],[645,1257],[954,1257],[645,1418],[954,1418]]).forEach(function(q){
      o += "<rect x='"+(q[0]-16)+"' y='"+(q[1]-16)+"' width='32' height='32' fill='#111'/>"; });
    var top = "";
    pts.forEach(function(q){
      var on = q[0]===key;
      if (on) top += "<circle cx='"+q[1]+"' cy='"+q[2]+"' r='44' fill='#ffd23f' stroke='#e53935' stroke-width='9'/><circle class='hl' cx='"+q[1]+"' cy='"+q[2]+"' r='60' fill='none' stroke='#e53935' stroke-width='7'/>"+svgT(q[1],q[2],q[0],q[0].length>2?24:32,"#7a1d12",900);
      else o += "<circle cx='"+q[1]+"' cy='"+q[2]+"' r='34' fill='#fff' stroke='#1f5f99' stroke-width='5' opacity='.6'/>"+svgT(q[1],q[2],q[0],q[0].length>2?20:26,"#1f5f99",600);
    });
    o += top + "</svg>";
    return "<div class='seat'><h4>👥 "+esc(f.f)+" "+esc(f.n)+"・你的組別位置</h4><p>"+(work?"工作人員桌在紅框處":"第 "+esc(p[3])+" 組在紅框處，找組長報到入座")+"</p>"+o+"</div>";
  }
  function ckHTML(p){
    if (!ckOpen()) return "";
    var s = sess(), am = localStorage.getItem(ckKey(p,"am")), pm = localStorage.getItem(ckKey(p,"pm")), h = "";
    if (s === "am") {
      h = am ? "<div class='ck done'>✓ 主場已報到 "+esc(am)+"</div>"
             : "<button class='ck' data-ck='"+p.i+"' data-s='am'>點我報到</button>";
    } else {
      if (am) h += "<div class='ck done small'>✓ 主場已報到 "+esc(am)+"</div>";
      h += pm ? "<div class='ck done'>✓ 論壇已報到 "+esc(pm)+"</div>"
              : "<button class='ck pm' data-ck='"+p.i+"' data-s='pm'>點我報到</button>";
    }
    h += (am || pm) ? guideHTML(p) : "";
    if (s === "pm" && pm) h += forumMapHTML(p);
    else if (s === "am" && am) h += seatHTML(p);
    return h;
  }
  function doCheck(btn){
    var p = P[+btn.getAttribute("data-ck")], f = F[p[2]], s = btn.getAttribute("data-s");
    btn.disabled = true; btn.textContent = "報到中…";
    fetch(GAS, {method:"POST", body: JSON.stringify({action:"checkin", id:rid(p, s), name:p[0], unit:p[1], forum:f.n,
      floor: s==="pm" ? f.f+"（論壇報到）" : "8樓（主場報到）",
      group: p[3]==="工作組" ? "工作組" : "第"+p[3]+"組", test:TEST})})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) throw 0;
        localStorage.setItem(ckKey(p, s), j.time);
        run();
      })
      .catch(function(){ btn.disabled = false; btn.textContent = "網路不穩，請再按一次"; });
  }

  var q = document.getElementById("q"), res = document.getElementById("res"), hint = document.getElementById("hint"), clr = document.getElementById("clr");
  function esc(s){ return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]}); }

  function card(p, key){
    var f = F[p[2]], c = COL[f.c], lead = p[4]&1, blue = p[4]&2, red = p[4]&4;
    var nm = p[0], i = key ? p.k.indexOf(key) : -1;
    var nmH = i>=0 ? esc(nm.slice(0,i))+"<mark>"+esc(nm.slice(i,i+key.length))+"</mark>"+esc(nm.slice(i+key.length)) : esc(nm);
    var work = p[3]==="工作組";
    var gp = work ? "<div><small>組別</small><span class='serif'>工作組</span></div>"
                  : "<div><small>組別</small><span class='serif'><i>第</i>"+p[3]+"<i>組</i></span></div>";
    return "<div class='card' style='--c:"+c[0]+";--cb:"+c[1]+"'>"+
      "<div class='ch'><b class='serif'>"+f.n+"</b><span>"+f.t+"</span></div>"+
      "<div class='who'><span class='nm"+(blue?" blue":"")+"'>"+nmH+"</span><span class='unit"+(red?" red":"")+"'>"+esc(p[1])+"</span>"+(lead?"<span class='lead'>組長</span>":"")+"</div>"+
      "<div class='where'><div><small>樓層</small><span class='serif'>"+f.f+"</span></div>"+gp+"</div>"+ckHTML(p)+"</div>";
  }

  function run(){
    var raw = q.value, key = norm(raw);
    clr.style.display = raw ? "block" : "none";
    if (key.length < 2){ res.innerHTML = ""; hint.style.display = "block"; return; }
    hint.style.display = "none";
    var hit = P.filter(function(p){ return p.k.indexOf(key) >= 0; });
    hit.sort(function(a,b){ return (b.k===key)-(a.k===key); });
    if (hit.length > 8 && !hit.some(function(p){return p.k===key;})){
      res.innerHTML = "<div class='more'>符合「"+esc(raw)+"」的人有 "+hit.length+" 位<br>請輸入<b>完整名字</b>來查詢</div>"; return;
    }
    if (hit.length > 8) hit = hit.filter(function(p){ return p.k===key; });
    if (hit.length){
      var h = hit.map(function(p){ return card(p, key); }).join("");
      if (hit.length > 1 && hit.every(function(p){return p.k===key;})) h = "<div class='multi'>有 "+hit.length+" 位同名，請看單位找自己：</div>" + h;
      res.innerHTML = h; return;
    }
    var sug = [];
    if (key.length >= 3){
      P.forEach(function(p){
        if (p.k.length !== key.length) return;
        var d = 0; for (var i=0;i<key.length;i++) if (p.k[i]!==key[i]) d++;
        if (d === 1 && sug.indexOf(p[0])<0) sug.push(p[0]);
      });
    }
    res.innerHTML = "<div class='none'>找不到「<b>"+esc(raw)+"</b>」<br>請確認名字的字有沒有打錯"+
      (sug.length && sug.length<=6 ? "<br>你是不是要找：<div class='sug'>"+sug.map(function(s){return "<button data-n='"+esc(s)+"'>"+esc(s)+"</button>";}).join("")+"</div>" : "<br>還是找不到，請洽報到處工作人員")+"</div>";
  }
  q.addEventListener("input", run);
  clr.addEventListener("click", function(){ q.value=""; run(); q.focus(); });
  // 已報到的人畫面開著時，每分鐘依時間更新就位提示
  setInterval(function(){ if (document.querySelector(".gd") && !document.querySelector(".ck:disabled")) run(); }, 60000);
  res.addEventListener("click", function(e){
    var t = e.target; if (!t.getAttribute) return;
    if (t.hasAttribute("data-ck")) { doCheck(t); return; }
    var n = t.getAttribute("data-n"); if (n){ q.value = n; run(); }
  });

  var tIn = document.getElementById("tIn"), tQr = document.getElementById("tQr");
  function tab(s){ tIn.classList.toggle("on", !s); tQr.classList.toggle("on", s);
    document.getElementById("find").style.display = s ? "none" : "block";
    document.getElementById("scan").style.display = s ? "block" : "none"; }
  tIn.addEventListener("click", function(){ tab(false); });
  tQr.addEventListener("click", function(){ tab(true); });
  // 分享到 LINE：手機會直接開 LINE 選好友／群組，電腦會開 LINE 分享頁
  document.getElementById("line").href = "https://line.me/R/share?text=" +
    encodeURIComponent("11/29 忠恕青年大會師｜論壇分組查詢\n輸入名字就能找到你的樓層和組別👇\nhttps://flyshinny.github.io/zhongshu-youth-1129-forum/?from=line");
})();
</script>
