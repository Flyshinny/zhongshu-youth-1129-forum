<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>報到看板｜11/29 青年大會師</title>
<link rel="icon" href="icon.png">
<style>
:root{--navy:#1D4262;--amber:#E2922A;--ink:#1F2F3D;--sub:#4E5E6B;--ok:#2e8b57;--f1:#1D4262;--f2:#A9505F;--f3:#2E6B55}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#eef2f2;color:var(--ink)}
header{background:var(--hd,var(--navy));color:#fff;padding:14px 16px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px;letter-spacing:1px}
.big{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.big b{font-size:40px;line-height:1}.big span{font-size:16px;opacity:.85}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.2);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}
.upd{font-size:12px;opacity:.75;margin-top:6px}
.sw{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:rgba(255,255,255,.15);border-radius:12px;padding:4px;margin-bottom:10px}
.sw a{color:#fff;text-decoration:none;text-align:center;font-weight:800;font-size:15px;padding:7px 0;border-radius:9px;opacity:.75}
.g .mini{height:5px;border-radius:5px;background:#e8edf1;margin-top:5px;overflow:hidden}.g .mini i{display:block;height:100%;background:var(--amber)}
.g.full .mini i{background:var(--ok)}
.recent{margin:12px 12px 0;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(29,66,98,.12);overflow:hidden}
.recent h3{margin:0;font-size:14px;padding:8px 14px;background:#f5efe2;color:var(--brown,#8A5410);display:flex;justify-content:space-between}
.recent .r{display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid #f0f0f0;font-size:15px}
.recent .r .u{color:var(--sub);font-size:13px}.recent .r .t{margin-left:auto;font-weight:800;color:var(--ok)}
.recent .r.new{animation:hl 2.5s ease-out}
@keyframes hl{from{background:#fff1c9}to{background:#fff}}
.recent .none{padding:10px 14px;color:var(--sub);font-size:14px}
.ov{grid-column:1/-1;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 2px 8px rgba(29,66,98,.12);border-left:8px solid var(--oc);cursor:pointer}
.ov .oh{display:flex;align-items:baseline;gap:8px}.ov .oh b{font-size:18px;color:var(--oc)}.ov .oh span{font-size:13px;color:var(--sub)}
.ov .on{font-size:15px;color:var(--sub);margin-top:2px}.ov .on b{font-size:30px;color:var(--ink)}.ov .on em{font-style:normal;font-weight:800;color:var(--oc)}
.ov .ob{height:8px;border-radius:8px;background:#e8edf1;overflow:hidden;margin:6px 0}.ov .ob i{display:block;height:100%;background:var(--oc)}
.ov .os{font-size:13px;color:var(--sub);line-height:1.6}
#mode a{color:#ffd98a;font-weight:800}
.sw a.on{background:#fff;color:var(--hd,var(--navy));opacity:1}
.row .fix{margin-left:auto;border:2px solid var(--amber);background:#fff7e8;color:#8A5410;font:inherit;font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;cursor:pointer}
.row .fix + .t{margin-left:10px}
.mask{position:fixed;inset:0;background:rgba(20,30,40,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.mask.on{display:flex}
.dlg{background:#fff;border-radius:18px;max-width:340px;width:100%;padding:20px 18px 16px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dt{font-size:16px;color:var(--sub);font-weight:700}
.dw{margin:10px 0 16px;font-size:15px;line-height:1.7}.dw b{display:block;font-size:26px;color:var(--ink)}.dw em{font-style:normal;color:#fff;border-radius:999px;padding:2px 10px;font-weight:800}
.db{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.db button{font:inherit;font-size:16px;font-weight:800;border:0;border-radius:12px;padding:12px 0;cursor:pointer;background:#e8edf1;color:var(--ink)}
.db .yes{background:var(--amber);color:#fff}.db button:disabled{opacity:.6}
.row .del{margin-left:auto;border:1.5px solid #c9cfd4;background:#fff;color:#8a949c;font:inherit;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;cursor:pointer}
.row .del + .t{margin-left:10px}
.dlg.warn{border:3px solid #c0392b}.dlg.warn .dt{color:#c0392b;font-size:18px;font-weight:900}
.db .red{background:#c0392b;color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#fff;font-weight:800;border-radius:999px;padding:10px 20px;display:none;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.row .am{font-size:12px;color:var(--sub);margin-left:6px}
.tabs{display:flex;gap:6px;padding:12px 12px 0;flex-wrap:wrap}
.tabs button{border:0;font:inherit;font-size:15px;font-weight:800;color:#fff;border-radius:999px;padding:7px 12px;opacity:.45;cursor:pointer}
.tabs button.on{opacity:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:12px}
.g{background:#fff;border-radius:12px;padding:8px 6px 9px;text-align:center;box-shadow:0 2px 6px rgba(29,66,98,.1);cursor:pointer;border:2px solid transparent}
.g b{display:block;font-size:15px}.g span{font-size:22px;font-weight:900}.g small{font-size:13px;color:var(--sub)}
.g.full{border-color:var(--ok);background:#e9f6ee}.g.on{border-color:var(--amber)}
.list{margin:0 12px 24px;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(29,66,98,.12);overflow:hidden}
.list h2{margin:0;font-size:17px;padding:10px 14px;background:#f5efe2;color:var(--navy)}
.row{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid #eee;font-size:16px}
.row .u{color:var(--sub);font-size:13px}.row .t{margin-left:auto;font-weight:800}
.row.no .t{color:#c0392b}.row.yes .t{color:var(--ok)}
.lead{font-size:11px;font-weight:800;background:#ffe9b8;color:#8A5410;border-radius:999px;padding:1px 7px}
.dgrid{padding:10px 12px;background:#fbfaf6}
.dh0{padding:14px;text-align:center;color:var(--sub);font-size:15px;border-top:1px solid #e3e8ec}
.list h3.dh{margin:0;font-size:15px;padding:8px 14px;background:#eef3f7;color:var(--navy);border-top:1px solid #e3e8ec}
.man{margin:12px 12px 0}
#manBtn{width:100%;border:0;border-radius:14px;background:var(--amber);color:#fff;font:inherit;font-size:18px;font-weight:900;padding:11px 10px;cursor:pointer;box-shadow:0 3px 0 #b86f12;display:flex;flex-direction:column;align-items:center;gap:1px}
#manBtn small{font-size:12px;font-weight:700;opacity:.9}
#manBox{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(29,66,98,.12);overflow:hidden;margin-top:8px}
.mq{display:flex;gap:8px;padding:10px}
.mq input{flex:1;font:inherit;font-size:18px;padding:9px 12px;border:2px solid var(--navy);border-radius:10px;outline:none;min-width:0}
.mq button{border:0;background:#e8edf1;border-radius:10px;font:inherit;font-weight:800;padding:0 12px;cursor:pointer}
#manRes .row b{font-size:17px}
#manRes .hint2{padding:8px 14px 12px;color:var(--sub);font-size:14px}
.row .fix.big{font-size:14px;padding:5px 12px;background:var(--amber);color:#fff;border-color:var(--amber)}
.msg{padding:40px 20px;text-align:center;color:var(--sub);line-height:1.8}
.testtag{background:#c0392b;color:#fff;font-size:12px;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:3px}
body:not(.kidsmode) #kids{display:none}
body.kidsmode .man,body.kidsmode #recent,body.kidsmode #tabs,body.kidsmode #grid,body.kidsmode #list{display:none}
.kids{margin:12px 12px 24px;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(29,66,98,.12);overflow:hidden}
.kids h3{margin:0;font-size:14px;padding:8px 14px;background:#fbe9df;color:#9a4a26;display:flex;justify-content:space-between}
.kids .kg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px}
.kids .kc{border:2px solid #e8edf1;border-radius:12px;padding:8px 10px;cursor:pointer;background:#fff}
.kids .kc.on{border-color:var(--amber)}.kids .kc.full{border-color:var(--ok);background:#e9f6ee}
.kids .kc b{display:block;font-size:16px;color:var(--kc)}.kids .kc span{font-size:26px;font-weight:900}.kids .kc small{font-size:13px;color:var(--sub)}
.kids .kc em{display:block;font-style:normal;font-size:12px;color:var(--sub);margin-top:2px}
.kids .kl h4{margin:0;font-size:14px;padding:7px 14px;background:#eef3f7;color:var(--navy);border-top:1px solid #e3e8ec}
.kids .none{padding:10px 14px;color:var(--sub);font-size:14px}
</style>
</head>

      L.innerHTML = "<div class='list'><h2>全真・各區報到情況（點區看名單）</h2><div class='grid dgrid'>"+
        DK.map(function(d){ var m = DS[d], c = m.filter(function(p){ return done[pid(p)]; }).length;
          return "<div class='g"+(c===m.length?" full":"")+(d===DSEL?" on":"")+"' data-d='"+esc(d)+"'><b>"+esc(d)+"</b><span>"+c+"</span><small>/"+m.length+"</small>"+
                 "<div class='mini'><i style='width:"+(100*c/m.length).toFixed(0)+"%'></i></div></div>"; }).join("")+"</div>"+
        (DSEL ? (function(){ var m = DS[DSEL], c = m.filter(function(p){ return done[pid(p)]; }).length;
          return "<h3 class='dh' id='dh'>全真・"+esc(DSEL)+"　"+c+"/"+m.length+"（未到的排前面）</h3>"+rows(m); })()
          : "<div class='dh0'>👆 點上方的區，看該區名單</div>")+"</div>";
      return;
    }
    L.innerHTML = "<div class='list'><h2>"+esc(sel)+"（未到的排前面）</h2>"+rows(UN[sel])+"</div>";
  }

  function render(){
    if (S === "kids") { if (window.kidsRender) window.kidsRender(); return; }   // 小朋友班頁由下方程式負責
    done = S==="pm" ? PM : AM;
    var ALL = S==="pm" ? P.filter(function(p){ return !isDT(p); }) : P;
    var total = ALL.length, n = ALL.filter(function(p){ return done[pid(p)]; }).length;
    document.getElementById("n").textContent = n;
    document.getElementById("of").textContent = "／ " + total + " 人已報到";
    document.getElementById("bar").style.width = (100*n/total).toFixed(1) + "%";
    renderRecent();
    if (manOpen) manRender();
    if (S === "am") { renderUnits(); return; }
    // 下午論壇：分頁＝全部論壇(-1)／高峰(0)／人才(1)／開創(2)／工作組(3)；論壇分頁不含工作組
    function cnt(a){ return a.filter(function(p){ return done[pid(p)]; }).length; }
    var TABS = [{t:-1, n:"📊 全部論壇", c:"#4E5E6B", a:FALL}].concat(REAL.map(function(i){ var f = F[i]; return {t:i, n:f.n+" "+f.f, c:COL[f.c], a:FP[i]}; }))
               .concat([{t:9, n:"🛠 工作組", c:"#8A5410", a:WALL}]);
    document.getElementById("tabs").innerHTML = TABS.map(function(x){
      return "<button data-t='"+x.t+"' class='"+(x.t===cur?"on":"")+"' style='background:"+x.c+"'>"+x.n+"　"+cnt(x.a)+"/"+x.a.length+"</button>";
    }).join("");
    var GR = document.getElementById("grid"), L = document.getElementById("list");
    if (cur === -1) {                                   // 全部論壇總覽
      GR.innerHTML = REAL.map(function(i){ var f = F[i];
        var gs = FORD[i].map(function(g){ var m = G[i][g]; return {g:g, c:cnt(m), n:m.length}; });
        var c = cnt(FP[i]), n = FP[i].length, full = gs.filter(function(x){ return x.c===x.n; }).length;
        var miss = gs.filter(function(x){ return x.c<x.n; }).sort(function(a,b){ return (b.n-b.c)-(a.n-a.c); }).slice(0,3)
                     .map(function(x){ return "第"+x.g+"組 "+x.c+"/"+x.n; }).join("、");
        return "<div class='ov' data-ov='"+i+"' style='--oc:"+COL[f.c]+"'><div class='oh'><b>"+f.n+"</b><span>"+f.f+"</span></div>"+
          "<div class='on'><b>"+c+"</b>／"+n+" 人　<em>"+(n?Math.round(100*c/n):0)+"%</em></div>"+
          "<div class='ob'><i style='width:"+(n?100*c/n:0).toFixed(1)+"%'></i></div>"+
          "<div class='os'>已到齊 "+full+"／"+gs.length+" 組"+(miss?"<br>未到最多："+miss:"")+"</div></div>";
      }).join("") + "<div class='ov' data-ov='9' style='--oc:#8A5410'><div class='oh'><b>工作組</b><span>各組工作人員</span></div>"+
          "<div class='on'><b>"+cnt(WALL)+"</b>／"+WALL.length+" 人</div><div class='ob'><i style='width:"+(100*cnt(WALL)/WALL.length).toFixed(1)+"%'></i></div></div>";
      L.innerHTML = ""; return;
    }
    var keys = cur===9 ? WORD : FORD[cur], grp = function(g){ return cur===9 ? WG[g] : G[cur][g]; };
    GR.innerHTML = keys.map(function(g){
      var m = grp(g), c = cnt(m);
      return "<div class='g"+(c===m.length?" full":"")+(g===sel?" on":"")+"' data-g='"+esc(g)+"'><b>"+(cur===9?esc(g):"第"+g+"組")+"</b><span>"+c+"</span><small>/"+m.length+"</small></div>";
    }).join("");
    if (sel == null || !grp(sel)) { L.innerHTML = ""; return; }
    var m = grp(sel).slice().sort(function(a,b){ return (!!done[pid(a)]) - (!!done[pid(b)]); });
    L.innerHTML = "<div class='list'><h2>"+(cur===9 ? "工作組・"+esc(sel) : F[cur].n+"・第"+sel+"組")+"（未到的排前面）</h2>"+
      m.map(function(p){ var t = done[pid(p)];
        var a = AM[pid(p)] ? "<span class='am'>主場✓</span>" : "";
        var u = cur===9 ? F[p[2]].n.slice(0,2) : p[1];
        return "<div class='row "+(t?"yes":"no")+"'><span>"+esc(p[0])+"</span><span class='u'>"+esc(u)+"</span>"+((p[4]&1)?"<span class='lead'>組長</span>":"")+a+
               (t?"<button class='del' data-del='"+p.i+"'>刪除</button>":"<button class='fix' data-fix='"+p.i+"'>補登</button>")+"<span class='t'>"+(t?"✓ "+esc(t):"未到")+"</span></div>"; }).join("")+"</div>";
  }
  document.getElementById("tabs").addEventListener("click", function(e){ var t = e.target.getAttribute("data-t"); if (t!=null){ cur = +t; sel = null; render(); } });
  // ---- 補登：工作人員確認本人已到場，直接幫他報到（先跳確認視窗）----
  var FIXP = null, FIXS = null, DSEL = null;   // DSEL：全真目前點開的區
  function onListClick(e){
    var xb = e.target.closest(".del"); if (xb){ openDel(P[+xb.getAttribute("data-del")], xb.getAttribute("data-ds")); return; }
    var dd = e.target.closest("[data-d]"); if (dd){ DSEL = dd.getAttribute("data-d"); render(); var t = document.getElementById("dh"); if (t) t.scrollIntoView({behavior:"smooth", block:"nearest"}); return; }
    var b = e.target.closest(".fix"); if (!b) return;
    FIXP = P[+b.getAttribute("data-fix")]; FIXS = b.getAttribute("data-fs") || S;
    var MAN = b.classList.contains("big");
    document.getElementById("dT").textContent = MAN ? "確定要幫他手動報到嗎？" : "確定要補登嗎？";
    var where = FIXP[3]==="工作組" ? "工作人員・"+FIXP[1] : whereOf(FIXP);
    document.getElementById("dw").innerHTML = "<b>"+esc(FIXP[0])+"</b>"+esc(FIXP[3]==="工作組"?"":FIXP[1]+"・")+esc(where)+
      "<br>"+(MAN?"報到為":"補登為")+" <em style='background:"+(FIXS==="pm"?"#2E6B55":"#1D4262")+"'>"+(FIXS==="pm"?"論壇報到":"主場報到")+"</em>";
    document.getElementById("dYes").disabled = false; document.getElementById("dYes").textContent = MAN ? "確定報到" : "確定補登";
    document.getElementById("mask").classList.add("on");
  }
  document.getElementById("list").addEventListener("click", onListClick);
  document.getElementById("manRes").addEventListener("click", onListClick);
  // ---- 手動報到：輸入姓名 → 列出符合的人 → 按「手動報到」→ 確認 ----
  var manOpen = false;
  function manRender(){
    var box = document.getElementById("manRes"), key = document.getElementById("manQ").value.replace(/[\s　]/g, "");
    if (key.length < 2) { box.innerHTML = "<div class='hint2'>輸入要報到的人的姓名，例如「王小明」。目前是「<b>"+(S==="pm"?"論壇報到":"主場報到")+"</b>」時段。</div>"; return; }
    var hit = P.filter(function(p){ return p[0].indexOf(key) >= 0; }).slice(0, 20);
    if (!hit.length) { box.innerHTML = "<div class='hint2'>找不到「"+esc(key)+"」，請確認姓名用字</div>"; return; }
    box.innerHTML = hit.map(function(p){
      var fs = isDT(p) ? "am" : S, t = (fs==="pm" ? PM : AM)[pid(p)], lab = fs==="pm" ? "論壇" : "主場";
      var u = p[3]==="工作組" ? "工作人員・"+p[1] : p[1]+"・"+whereOf(p);
      return "<div class='row "+(t?"yes":"no")+"'><b>"+esc(p[0])+"</b><span class='u'>"+esc(u)+"</span>"+
        (t ? "<button class='del' data-del='"+p.i+"' data-ds='"+fs+"'>刪除</button><span class='t'>✓ "+lab+" "+esc(t)+"</span>"
           : "<button class='fix big' data-fix='"+p.i+"' data-fs='"+fs+"'>手動報到（"+lab+"）</button>")+"</div>";
    }).join("");
  }
  document.getElementById("manBtn").addEventListener("click", function(){
    manOpen = !manOpen; document.getElementById("manBox").hidden = !manOpen;
    if (manOpen) { manRender(); document.getElementById("manQ").focus(); } });
  document.getElementById("manX").addEventListener("click", function(){ manOpen = false; document.getElementById("manBox").hidden = true; document.getElementById("manQ").value = ""; });
  document.getElementById("manQ").addEventListener("input", manRender);
  function closeDlg(){ document.getElementById("mask").classList.remove("on"); FIXP = null; }
  // ---- 刪除報到：兩段確認（第二段倒數 3 秒才可按），刪除紀錄保留在試算表 ----
  var DELP = null, DELS = null, XSTEP = 0, XCD = null;
  function delInfo(p, s){
    var t = (s==="pm" ? PM : AM)[pid(p)], where = p[3]==="工作組" ? "工作人員・"+p[1] : whereOf(p);
    return "<b>"+esc(p[0])+"</b>"+esc(p[3]==="工作組"?"":p[1]+"・")+esc(where)+
      "<br><em style='background:"+(s==="pm"?"#2E6B55":"#1D4262")+"'>"+(s==="pm"?"論壇報到":"主場報到")+"</em>　✓ "+esc(t||"");
  }
  function openDel(p, ds){
    DELP = p; DELS = ds || S; XSTEP = 1; clearInterval(XCD);
    document.getElementById("xD").className = "dlg";
    document.getElementById("xT").textContent = "確定要刪除這筆報到嗎？";
    document.getElementById("xW").innerHTML = delInfo(p, DELS);
    var y = document.getElementById("xYes"); y.disabled = false; y.textContent = "下一步"; y.className = "yes";
    document.getElementById("mask2").classList.add("on");
  }
  function closeDel(){ clearInterval(XCD); document.getElementById("mask2").classList.remove("on"); DELP = null; XSTEP = 0; }
  document.getElementById("xNo").addEventListener("click", closeDel);
  document.getElementById("mask2").addEventListener("click", function(e){ if (e.target.id === "mask2") closeDel(); });
  document.getElementById("xYes").addEventListener("click", function(){
    if (!DELP) return;
    var y = this, p = DELP, s = DELS;
    if (XSTEP === 1) {                                   // 第二段：紅色警告＋倒數
      XSTEP = 2;
      document.getElementById("xD").className = "dlg warn";
      document.getElementById("xT").textContent = "⚠️ 再次確認刪除";
      document.getElementById("xW").innerHTML = delInfo(p, s) + "<br><br>刪除後此人會變回「<b style='display:inline;font-size:inherit;color:#c0392b'>未到</b>」，可重新報到或補登。<br><small>（原始資料會保留在試算表「刪除紀錄」）</small>";
      y.className = "red"; var n = 3; y.disabled = true; y.textContent = "確定刪除（" + n + "）";
      XCD = setInterval(function(){ n--; if (n > 0) y.textContent = "確定刪除（" + n + "）"; else { clearInterval(XCD); y.disabled = false; y.textContent = "確定刪除"; } }, 1000);
      return;
    }
    if (XSTEP !== 2) return;
    var id = pid(p) + (s==="pm" ? "#pm" : "");
    y.disabled = true; y.textContent = "刪除中…";
    fetch(GAS, {method:"POST", body: JSON.stringify({action:"delete", id:id, k:K, test:TEST})})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) throw j.msg || 0;
        delete (s==="pm" ? PM : AM)[pid(p)];  ovSet(id, null);
        ROWS = ROWS.filter(function(r){ return String(r[0]) !== id; });
        closeDel(); render();
        var t = document.getElementById("toast"); t.textContent = "🗑 已刪除 " + p[0] + " 的" + (s==="pm" ? "論壇" : "主場") + "報到";
        t.style.background = "#c0392b"; t.style.display = "block"; setTimeout(function(){ t.style.display = "none"; t.style.background = ""; }, 2500);
      })
      .catch(function(m){ y.disabled = false; y.textContent = m==="key" ? "密碼不正確，無法刪除" : "失敗，再按一次"; });
  });
  document.getElementById("dNo").addEventListener("click", closeDlg);
  document.getElementById("mask").addEventListener("click", function(e){ if (e.target.id === "mask") closeDlg(); });
  document.getElementById("dYes").addEventListener("click", function(){
    if (!FIXP) return;
    var p = FIXP, s = FIXS, f = F[p[2]], btn = this, id = pid(p) + (s==="pm" ? "#pm" : "");
    btn.disabled = true; btn.textContent = "補登中…";
    fetch(GAS, {method:"POST", body: JSON.stringify({action:"checkin", id:id, name:p[0], unit:p[1], forum:f.n,
      floor: s==="pm" ? f.f+"（論壇補登）" : "8樓（主場補登）", group: (p[3]==="工作組"||p[3]==="點傳師") ? p[3] : "第"+p[3]+"組", test:TEST})})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) throw 0;
        (s==="pm" ? PM : AM)[pid(p)] = j.time; ROWS.push([id, j.time]); SEEN[id + "@" + j.time] = 1;  ovSet(id, j.time);
        closeDlg(); render();
        var t = document.getElementById("toast"); t.textContent = "✓ " + p[0] + (j.already ? " 之前已報到 " : " 已補登 ") + j.time;
        t.style.display = "block"; setTimeout(function(){ t.style.display = "none"; }, 2500);
      })
      .catch(function(){ btn.disabled = false; btn.textContent = "失敗，再按一次"; });
  });
  document.getElementById("grid").addEventListener("click", function(e){
    var ov = e.target.closest(".ov"); if (ov){ cur = +ov.getAttribute("data-ov"); sel = null; render(); return; }
    var el = e.target.closest(".g"); if (el){ sel = el.getAttribute("data-g"); render(); document.getElementById("list").scrollIntoView({behavior:"smooth"}); } });

  // 本機暫存：這台看板剛做的報到／刪除，60 秒內優先顯示，避免重新整理時因伺服器快取看到舊資料
  var OV_KEY = "staffov:" + (TEST ? "t" : "p");
  function ovGet(){ try { var o = JSON.parse(localStorage.getItem(OV_KEY) || "{}"), now = Date.now(), c = {}; for (var k in o) if (o[k].x > now) c[k] = o[k]; return c; } catch(e){ return {}; } }
  function ovSet(id, t){ var o = ovGet(); o[id] = {t:t, x:Date.now() + 60000}; try { localStorage.setItem(OV_KEY, JSON.stringify(o)); } catch(e){} }
  function ovApply(){
    var o = ovGet();
    for (var id in o) {
      var M = /#pm$/.test(id) ? PM : AM, k = id.replace(/#pm$/, "");
      if (o[id].t) { if (!M[k]) { M[k] = o[id].t; if (!ROWS.some(function(r){ return String(r[0])===id; })) ROWS.push([id, o[id].t]); } }
      else { delete M[k]; ROWS = ROWS.filter(function(r){ return String(r[0])!==id; }); }
    }
  }
  function load(){
    fetch(GAS + "?action=list&k=" + encodeURIComponent(K) + (TEST?"&test=1":""))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok){ document.getElementById("upd").textContent = "密碼不正確，請確認看板網址"; return; }
        AM = {}; PM = {}; var SEEN1 = {}; ROWS = j.rows.filter(function(r){ var k = String(r[0]); if (SEEN1[k]) return false; SEEN1[k] = 1; return true; });
        if (!LOADED) ROWS.forEach(function(r){ SEEN[String(r[0]) + "@" + r[1]] = 1; });   // 第一次打開時的舊資料不標新
        LOADED = true;
        j.rows.forEach(function(r){ var id = String(r[0]), M = /#pm$/.test(id) ? PM : AM, k = id.replace(/#pm$/,""); if (!M[k]) M[k] = r[1]; });   // 重複的只留最早一筆
        ovApply();   // 疊上這台看板 60 秒內自己做的報到／刪除（伺服器讀取有 10 秒快取）
        if (S !== "kids") document.getElementById("upd").textContent = "最後更新 " + j.now + "　每 30 秒自動更新　" + (S==="am" ? "點單位看名單" : "點組別看名單");
        render();
      })
      .catch(function(){ document.getElementById("upd").textContent = "連線失敗，30 秒後重試"; });
  }
  if (!/^https:/.test(GAS)) { document.body.insertAdjacentHTML("beforeend","<div class='msg'>報到服務尚未設定</div>"); render(); return; }
  if (!K) { document.body.innerHTML = "<div class='msg'>這是工作人員專用頁面。<br>請使用完整的看板網址開啟。</div>"; return; }
  render(); load(); setInterval(load, 30000);
})();
</script>
<script>
// 國小班・幼幼班 報到狀況（只能看；點名請班導師用 kids.html）
(function(){
  var GAS = "https://script.google.com/macros/s/AKfycbzOuOQhiTAeQQUUeCzT0Ze0qCdCrCwGMckL9XiDljPgSxCSvUHuRdCBXRFL-fKpfZ4/exec", K = (location.hash.match(/k=([^&]+)/)||[])[1], TEST = /[?&]test=1/.test(location.search);
  var NM = {yy:"幼幼班", gs:"國小班"}, KC = {yy:"#C9663A", gs:"#1D4262"}, R = null, ST = {}, sel = null, NOW = "";
  var box = document.getElementById("kids");
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function on(id){ return !!(ST[id] && ST[id][0]); }
  function ppl(c){
    var k = R[c].kids.map(function(p){ return {id:p.id, n:p.n, u:p.u, s:(p.p ? "家長 " + p.p : "")}; }), t = R[c].tch.map(function(p){ return {id:p.id, n:p.n, u:"", s:p.note || ""}; });
    Object.keys(ST).forEach(function(id){ var s = ST[id]; if (!s[0]) return;
      if (id.indexOf(c + "X") === 0) k.push({id:id, n:s[2], u:s[3], s:"臨時加入"});
      if (id.indexOf(c + "Y") === 0) t.push({id:id, n:s[2], u:s[3], s:"臨時加入"}); });
    return {k:k, t:t};
  }
  function cnt(a){ return a.filter(function(x){ return on(x.id); }).length; }
  function rows(a){
    return a.slice().sort(function(x, y){ return on(x.id) - on(y.id); }).map(function(x){ var o = on(x.id);
      return "<div class='row " + (o ? "yes" : "no") + "'><span>" + esc(x.n) + "</span><span class='u'>" + esc([x.u, x.s].filter(Boolean).join("・")) + "</span><span class='t'>" + (o ? "✓ " + esc(ST[x.id][1]) : "未到") + "</span></div>"; }).join("");
  }
  function render(){
    if (!R) return;
    var h = "<h3><span>🧒 國小班・幼幼班 報到狀況</span><span>" + NOW + " 更新</span></h3><div class='kg'>";
    ["yy", "gs"].forEach(function(c){ var P = ppl(c), n = cnt(P.k);
      h += "<div class='kc" + (n === P.k.length && n ? " full" : "") + (sel === c ? " on" : "") + "' data-kc='" + c + "' style='--kc:" + KC[c] + "'><b>" + NM[c] + "</b><span>" + n + "</span><small>／" + P.k.length + " 位學員</small>" +
           "<em>師資 " + cnt(P.t) + "／" + P.t.length + "</em><em>" + (sel === c ? "▲ 收起名單" : "▼ 點開看名單") + "</em></div>"; });
    h += "</div>";
    if (sel) { var P = ppl(sel);
      h += "<div class='kl'><h4>" + NM[sel] + "學員（未到的排前面）</h4>" + rows(P.k) + (P.t.length ? "<h4>" + NM[sel] + "師資</h4>" + rows(P.t) : "") + "</div>"; }
    box.innerHTML = h; box.hidden = false;
    if (document.body.classList.contains("kidsmode")) {
      var a = ppl("yy").k.concat(ppl("gs").k), n = cnt(a);
      document.getElementById("n").textContent = n; document.getElementById("of").textContent = "／ " + a.length + " 位小朋友已報到";
      document.getElementById("bar").style.width = (a.length ? 100 * n / a.length : 0).toFixed(1) + "%";
      document.getElementById("upd").textContent = "最後更新 " + NOW + "　每 30 秒自動更新　點班別看名單（點名請班導師用點名頁）";
    }
  }
  window.kidsRender = function(){ if (R) render(); else { document.getElementById("n").textContent = "–"; document.getElementById("of").textContent = "／ – 位小朋友已報到"; document.getElementById("upd").textContent = "讀取中…"; } };
  box.addEventListener("click", function(e){ var c = e.target.closest("[data-kc]"); if (!c) return; sel = sel === c.dataset.kc ? null : c.dataset.kc; render(); });
  function load(){
    fetch(GAS + "?action=kids&k=" + encodeURIComponent(K) + (TEST ? "&test=1" : "")).then(function(r){ return r.json(); }).then(function(j){
      if (!j.ok || !j.roster) return;   // 後端還沒更新或密碼不對：整區不顯示
      R = j.roster; ST = j.st || {}; NOW = j.now; render();
    }).catch(function(){});
  }
  if (!K || !/^https:/.test(GAS)) return;
  load(); setInterval(load, 30000);
})();
</script>
