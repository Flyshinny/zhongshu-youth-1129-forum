<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>報到看板｜11/29 青年大會師</title>
<link rel="icon" href="icon.png">
<style>
:root{--navy:#1D4262;--amber:#E2922A;--ink:#1F2F3D;--sub:#4E5E6B;--ok:#2e8b57;--f1:#1D4262;--f2:#A9505F;--f3:#2E6B55}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#eef2f2;color:var(--ink)}
header{background:var(--hd,var(--navy));color:#fff;padding:14px 16px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px;letter-spacing:1px}
.big{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.big b{font-size:40px;line-height:1}.big span{font-size:16px;opacity:.85}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.2);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}
.upd{font-size:12px;opacity:.75;margin-top:6px}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(255,255,255,.15);border-radius:12px;padding:4px;margin-bottom:10px}
.sw a{color:#fff;text-decoration:none;text-align:center;font-weight:800;font-size:15px;padding:7px 0;border-radius:9px;opacity:.75}
.g .mini{height:5px;border-radius:5px;background:#e8edf1;margin-top:5px;overflow:hidden}.g .mini i{display:block;height:100%;background:var(--amber)}
.g.full .mini i{background:var(--ok)}
.recent{margin:12px 12px 0;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(29,66,98,.12);overflow:hidden}
.recent h3{margin:0;font-size:14px;padding:8px 14px;background:#f5efe2;color:var(--brown,#8A5410);display:flex;justify-content:space-between}
.recent .r{display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid #f0f0f0;font-size:15px}
.recent .r .u{color:var(--sub);font-size:13px}.recent .r .t{margin-left:auto;font-weight:800;color:var(--ok)}
.recent .r.new{animation:hl 2.5s ease-out}
@keyframes hl{from{background:#fff1c9}to{background:#fff}}
.recent .none{padding:10px 14px;color:var(--sub);font-size:14px}
.ov{grid-column:1/-1;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 2px 8px rgba(29,66,98,.12);border-left:8px solid var(--oc);cursor:pointer}
.ov .oh{display:flex;align-items:baseline;gap:8px}.ov .oh b{font-size:18px;color:var(--oc)}.ov .oh span{font-size:13px;color:var(--sub)}
.ov .on{font-size:15px;color:var(--sub);margin-top:2px}.ov .on b{font-size:30px;color:var(--ink)}.ov .on em{font-style:normal;font-weight:800;color:var(--oc)}
.ov .ob{height:8px;border-radius:8px;background:#e8edf1;overflow:hidden;margin:6px 0}.ov .ob i{display:block;height:100%;background:var(--oc)}
.ov .os{font-size:13px;color:var(--sub);line-height:1.6}
#mode a{color:#ffd98a;font-weight:800}
.sw a.on{background:#fff;color:var(--hd,var(--navy));opacity:1}
.row .fix{margin-left:auto;border:2px solid var(--amber);background:#fff7e8;color:#8A5410;font:inherit;font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;cursor:pointer}
.row .fix + .t{margin-left:10px}
.mask{position:fixed;inset:0;background:rgba(20,30,40,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.mask.on{display:flex}
.dlg{background:#fff;border-radius:18px;max-width:340px;width:100%;padding:20px 18px 16px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dt{font-size:16px;color:var(--sub);font-weight:700}
.dw{margin:10px 0 16px;font-size:15px;line-height:1.7}.dw b{display:block;font-size:26px;color:var(--ink)}.dw em{font-style:normal;color:#fff;border-radius:999px;padding:2px 10px;font-weight:800}
.db{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.db button{font:inherit;font-size:16px;font-weight:800;border:0;border-radius:12px;padding:12px 0;cursor:pointer;background:#e8edf1;color:var(--ink)}
.db .yes{background:var(--amber);color:#fff}.db button:disabled{opacity:.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#fff;font-weight:800;border-radius:999px;padding:10px 20px;display:none;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.row .am{font-size:12px;color:var(--sub);margin-left:6px}
.tabs{display:flex;gap:6px;padding:12px 12px 0;flex-wrap:wrap}
.tabs button{border:0;font:inherit;font-size:15px;font-weight:800;color:#fff;border-radius:999px;padding:7px 12px;opacity:.45;cursor:pointer}
.tabs button.on{opacity:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:12px}
.g{background:#fff;border-radius:12px;padding:8px 6px 9px;text-align:center;box-shadow:0 2px 6px rgba(29,66,98,.1);cursor:pointer;border:2px solid transparent}
.g b{display:block;font-size:15px}.g span{font-size:22px;font-weight:900}.g small{font-size:13px;color:var(--sub)}
.g.full{border-color:var(--ok);background:#e9f6ee}.g.on{border-color:var(--amber)}
.list{margin:0 12px 24px;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(29,66,98,.12);overflow:hidden}
.list h2{margin:0;font-size:17px;padding:10px 14px;background:#f5efe2;color:var(--navy)}
.row{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid #eee;font-size:16px}
.row .u{color:var(--sub);font-size:13px}.row .t{margin-left:auto;font-weight:800}
.row.no .t{color:#c0392b}.row.yes .t{color:var(--ok)}
.lead{font-size:11px;font-weight:800;background:#ffe9b8;color:#8A5410;border-radius:999px;padding:1px 7px}
.msg{padding:40px 20px;text-align:center;color:var(--sub);line-height:1.8}
.testtag{background:#c0392b;color:#fff;font-size:12px;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:3px}
</style>
</head>

      if (!p) return;
      var f = F[p[2]], where = p[3]==="工作組" ? p[1] : f.n.slice(0,2)+"・第"+p[3]+"組";
      h += "<div class='r"+(isNew?" new":"")+"'><b>"+esc(p[0])+"</b><span class='u'>"+esc(p[3]==="工作組"?"工作人員":p[1])+"・"+esc(where)+"</span><span class='t'>✓ "+esc(r[1])+"</span></div>";
    });
    document.getElementById("recent").innerHTML = h;
  }
  // 上午看板依「單位」整理（工作組的人歸到「工作人員」）
  function unitOf(p){ return p[3]==="工作組" ? "工作人員" : p[1]; }
  var UN = {}; P.forEach(function(p){ var u = unitOf(p); (UN[u] = UN[u] || []).push(p); });
  var UORDER = Object.keys(UN).sort(function(a,b){ return (a==="工作人員") - (b==="工作人員") || UN[b].length - UN[a].length; });

  function renderUnits(){
    document.getElementById("tabs").innerHTML = "";
    document.getElementById("grid").innerHTML = UORDER.map(function(u){
      var m = UN[u], c = m.filter(function(p){ return done[pid(p)]; }).length;
      return "<div class='g"+(c===m.length?" full":"")+(u===sel?" on":"")+"' data-g='"+esc(u)+"'><b>"+esc(u)+"</b><span>"+c+"</span><small>/"+m.length+"</small>"+
             "<div class='mini'><i style='width:"+(100*c/m.length).toFixed(0)+"%'></i></div></div>";
    }).join("");
    var L = document.getElementById("list");
    if (sel == null || !UN[sel]) { L.innerHTML = ""; return; }
    var m = UN[sel].slice().sort(function(a,b){ return (!!done[pid(a)]) - (!!done[pid(b)]); });
    L.innerHTML = "<div class='list'><h2>"+esc(sel)+"（未到的排前面）</h2>"+
      m.map(function(p){ var t = done[pid(p)], f = F[p[2]];
        var where = p[3]==="工作組" ? esc(p[1]) : f.n.slice(0,2)+"・第"+p[3]+"組";
        return "<div class='row "+(t?"yes":"no")+"'><span>"+esc(p[0])+"</span><span class='u'>"+where+"</span>"+
               (t?"":"<button class='fix' data-fix='"+p.i+"'>補登</button>")+"<span class='t'>"+(t?"✓ "+esc(t):"未到")+"</span></div>"; }).join("")+"</div>";
  }

  function render(){
    done = S==="pm" ? PM : AM;
    var total = P.length, n = P.filter(function(p){ return done[pid(p)]; }).length;
    document.getElementById("n").textContent = n;
    document.getElementById("of").textContent = "／ " + total + " 人已報到";
    document.getElementById("bar").style.width = (100*n/total).toFixed(1) + "%";
    renderRecent();
    if (S === "am") { renderUnits(); return; }
    // 下午論壇：分頁＝全部論壇(-1)／高峰(0)／人才(1)／開創(2)／工作組(3)；論壇分頁不含工作組
    function cnt(a){ return a.filter(function(p){ return done[pid(p)]; }).length; }
    var TABS = [{t:-1, n:"📊 全部論壇", c:"#4E5E6B", a:FALL}].concat(F.map(function(f, i){ return {t:i, n:f.n+" "+f.f, c:COL[f.c], a:FP[i]}; }))
               .concat([{t:3, n:"🛠 工作組", c:"#8A5410", a:WALL}]);
    document.getElementById("tabs").innerHTML = TABS.map(function(x){
      return "<button data-t='"+x.t+"' class='"+(x.t===cur?"on":"")+"' style='background:"+x.c+"'>"+x.n+"　"+cnt(x.a)+"/"+x.a.length+"</button>";
    }).join("");
    var GR = document.getElementById("grid"), L = document.getElementById("list");
    if (cur === -1) {                                   // 全部論壇總覽
      GR.innerHTML = F.map(function(f, i){
        var gs = FORD[i].map(function(g){ var m = G[i][g]; return {g:g, c:cnt(m), n:m.length}; });
        var c = cnt(FP[i]), n = FP[i].length, full = gs.filter(function(x){ return x.c===x.n; }).length;
        var miss = gs.filter(function(x){ return x.c<x.n; }).sort(function(a,b){ return (b.n-b.c)-(a.n-a.c); }).slice(0,3)
                     .map(function(x){ return "第"+x.g+"組 "+x.c+"/"+x.n; }).join("、");
        return "<div class='ov' data-ov='"+i+"' style='--oc:"+COL[f.c]+"'><div class='oh'><b>"+f.n+"</b><span>"+f.f+"</span></div>"+
          "<div class='on'><b>"+c+"</b>／"+n+" 人　<em>"+(n?Math.round(100*c/n):0)+"%</em></div>"+
          "<div class='ob'><i style='width:"+(n?100*c/n:0).toFixed(1)+"%'></i></div>"+
          "<div class='os'>已到齊 "+full+"／"+gs.length+" 組"+(miss?"<br>未到最多："+miss:"")+"</div></div>";
      }).join("") + "<div class='ov' data-ov='3' style='--oc:#8A5410'><div class='oh'><b>工作組</b><span>各組工作人員</span></div>"+
          "<div class='on'><b>"+cnt(WALL)+"</b>／"+WALL.length+" 人</div><div class='ob'><i style='width:"+(100*cnt(WALL)/WALL.length).toFixed(1)+"%'></i></div></div>";
      L.innerHTML = ""; return;
    }
    var keys = cur===3 ? WORD : FORD[cur], grp = function(g){ return cur===3 ? WG[g] : G[cur][g]; };
    GR.innerHTML = keys.map(function(g){
      var m = grp(g), c = cnt(m);
      return "<div class='g"+(c===m.length?" full":"")+(g===sel?" on":"")+"' data-g='"+esc(g)+"'><b>"+(cur===3?esc(g):"第"+g+"組")+"</b><span>"+c+"</span><small>/"+m.length+"</small></div>";
    }).join("");
    if (sel == null || !grp(sel)) { L.innerHTML = ""; return; }
    var m = grp(sel).slice().sort(function(a,b){ return (!!done[pid(a)]) - (!!done[pid(b)]); });
    L.innerHTML = "<div class='list'><h2>"+(cur===3 ? "工作組・"+esc(sel) : F[cur].n+"・第"+sel+"組")+"（未到的排前面）</h2>"+
      m.map(function(p){ var t = done[pid(p)];
        var a = AM[pid(p)] ? "<span class='am'>主場✓</span>" : "";
        var u = cur===3 ? F[p[2]].n.slice(0,2) : p[1];
        return "<div class='row "+(t?"yes":"no")+"'><span>"+esc(p[0])+"</span><span class='u'>"+esc(u)+"</span>"+((p[4]&1)?"<span class='lead'>組長</span>":"")+a+
               (t?"":"<button class='fix' data-fix='"+p.i+"'>補登</button>")+"<span class='t'>"+(t?"✓ "+esc(t):"未到")+"</span></div>"; }).join("")+"</div>";
  }
  document.getElementById("tabs").addEventListener("click", function(e){ var t = e.target.getAttribute("data-t"); if (t!=null){ cur = +t; sel = null; render(); } });
  // ---- 補登：工作人員確認本人已到場，直接幫他報到（先跳確認視窗）----
  var FIXP = null, FIXS = null;
  document.getElementById("list").addEventListener("click", function(e){
    var b = e.target.closest(".fix"); if (!b) return;
    FIXP = P[+b.getAttribute("data-fix")]; FIXS = S;
    var f = F[FIXP[2]], where = FIXP[3]==="工作組" ? "工作人員・"+FIXP[1] : f.n+"・第"+FIXP[3]+"組";
    document.getElementById("dw").innerHTML = "<b>"+esc(FIXP[0])+"</b>"+esc(FIXP[3]==="工作組"?"":FIXP[1]+"・")+esc(where)+
      "<br>補登為 <em style='background:"+(FIXS==="pm"?"#2E6B55":"#1D4262")+"'>"+(FIXS==="pm"?"論壇報到":"主場報到")+"</em>";
    document.getElementById("dYes").disabled = false; document.getElementById("dYes").textContent = "確定補登";
    document.getElementById("mask").classList.add("on");
  });
  function closeDlg(){ document.getElementById("mask").classList.remove("on"); FIXP = null; }
  document.getElementById("dNo").addEventListener("click", closeDlg);
  document.getElementById("mask").addEventListener("click", function(e){ if (e.target.id === "mask") closeDlg(); });
  document.getElementById("dYes").addEventListener("click", function(){
    if (!FIXP) return;
    var p = FIXP, s = FIXS, f = F[p[2]], btn = this, id = pid(p) + (s==="pm" ? "#pm" : "");
    btn.disabled = true; btn.textContent = "補登中…";
    fetch(GAS, {method:"POST", body: JSON.stringify({action:"checkin", id:id, name:p[0], unit:p[1], forum:f.n,
      floor: s==="pm" ? f.f+"（論壇補登）" : "8樓（主場補登）", group: p[3]==="工作組" ? "工作組" : "第"+p[3]+"組", test:TEST})})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) throw 0;
        (s==="pm" ? PM : AM)[pid(p)] = j.time; ROWS.push([id, j.time]); SEEN[id + "@" + j.time] = 1;
        closeDlg(); render();
        var t = document.getElementById("toast"); t.textContent = "✓ " + p[0] + (j.already ? " 之前已報到 " : " 已補登 ") + j.time;
        t.style.display = "block"; setTimeout(function(){ t.style.display = "none"; }, 2500);
      })
      .catch(function(){ btn.disabled = false; btn.textContent = "失敗，再按一次"; });
  });
  document.getElementById("grid").addEventListener("click", function(e){
    var ov = e.target.closest(".ov"); if (ov){ cur = +ov.getAttribute("data-ov"); sel = null; render(); return; }
    var el = e.target.closest(".g"); if (el){ sel = el.getAttribute("data-g"); render(); document.getElementById("list").scrollIntoView({behavior:"smooth"}); } });

  function load(){
    fetch(GAS + "?action=list&k=" + encodeURIComponent(K) + (TEST?"&test=1":""))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok){ document.getElementById("upd").textContent = "密碼不正確，請確認看板網址"; return; }
        AM = {}; PM = {}; ROWS = j.rows;
        if (!LOADED) ROWS.forEach(function(r){ SEEN[String(r[0]) + "@" + r[1]] = 1; });   // 第一次打開時的舊資料不標新
        LOADED = true;
        j.rows.forEach(function(r){ var id = String(r[0]); if (/#pm$/.test(id)) PM[id.slice(0,-3)] = r[1]; else AM[id] = r[1]; });
        document.getElementById("upd").textContent = "最後更新 " + j.now + "　每 30 秒自動更新　" + (S==="am" ? "點單位看名單" : "點組別看名單");
        render();
      })
      .catch(function(){ document.getElementById("upd").textContent = "連線失敗，30 秒後重試"; });
  }
  if (!/^https:/.test(GAS)) { document.body.insertAdjacentHTML("beforeend","<div class='msg'>報到服務尚未設定</div>"); render(); return; }
  if (!K) { document.body.innerHTML = "<div class='msg'>這是工作人員專用頁面。<br>請使用完整的看板網址開啟。</div>"; return; }
  render(); load(); setInterval(load, 30000);
})();
</script>
</body>
</html>
