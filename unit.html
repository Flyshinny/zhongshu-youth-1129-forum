<meta charset="utf-8">

<title>各單位報到情況｜11/29 青年大會師</title>
<link rel="icon" href="icon.png">
<style>
:root{--navy:#1D4262;--amber:#E2922A;--ink:#1F2F3D;--sub:#4E5E6B;--ok:#2e8b57;--pm:#2E6B55;--brown:#8A5410}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#eef2f2;color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px;letter-spacing:1px}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tot div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;cursor:pointer;border:2px solid transparent}
.tot div.on{background:#fff;color:var(--navy);border-color:#ffd98a}.tot div.on em{color:var(--brown)}
.tot div.dim{opacity:.5}
.mode{font-size:13px;margin-top:8px;color:#ffd98a;font-weight:800}
.tot small{display:block;font-size:13px;opacity:.85;font-weight:700}
.tot b{font-size:28px}.tot span{font-size:14px;opacity:.85}.tot em{font-style:normal;font-weight:900;color:#ffd98a;margin-left:6px;font-size:17px}
.upd{font-size:12px;opacity:.75;margin-top:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 12px 2px;scrollbar-width:none}
.chips button{flex:0 0 auto;font:inherit;font-size:14px;font-weight:800;border:2px solid #c9d3e0;background:#fff;color:var(--navy);border-radius:999px;padding:5px 12px;cursor:pointer}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;padding:12px}
.u{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 2px 8px rgba(29,66,98,.12);cursor:pointer;border:2px solid transparent}
.u.on{border-color:var(--amber)}
.u h3{margin:0 0 6px;font-size:19px;display:flex;align-items:baseline;gap:8px;color:var(--navy)}
.u h3 span{font-size:13px;color:var(--sub);font-weight:700}
.m{display:grid;grid-template-columns:62px 1fr 92px;align-items:center;gap:8px;margin-top:5px;font-size:14px}
.m label{font-weight:800;color:var(--sub)}
.m .b{height:10px;border-radius:10px;background:#e8edf1;overflow:hidden}.m .b i{display:block;height:100%;background:var(--amber)}
.m.pm .b i{background:var(--pm)}
.m .v{text-align:right;font-weight:800}.m .v em{font-style:normal;color:var(--brown);font-size:16px;margin-left:4px}
.m.pm .v em{color:var(--pm)}
.u.full{background:#f0faf3}
.list{margin:0 12px 24px;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(29,66,98,.12);overflow:hidden}
.list h2{margin:0;font-size:17px;padding:10px 14px;background:#f5efe2;color:var(--navy);display:flex;justify-content:space-between;align-items:baseline}
.list h2 small{font-size:13px;color:var(--sub)}
.list h4{margin:0;padding:6px 14px;font-size:14px;background:#f7f9fa;color:var(--sub);border-top:1px solid #eee}
.row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid #f0f0f0;font-size:16px;flex-wrap:wrap}
.row .w{color:var(--sub);font-size:13px}
.row .s{margin-left:auto;display:flex;gap:6px}
.row .s span{font-size:13px;font-weight:800;border-radius:999px;padding:2px 9px;background:#fdecea;color:#c0392b}
.row .s span.y{background:#e3f3e6;color:#24734a}
.row .s span.na{background:#f0f0f0;color:#999}
.lead{font-size:11px;font-weight:800;background:#ffe9b8;color:var(--brown);border-radius:999px;padding:1px 7px}
.msg{padding:40px 20px;text-align:center;color:var(--sub);line-height:1.8}
.testtag{background:#c0392b;color:#fff;font-size:12px;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:3px}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;padding:10px 14px;background:#fbfaf6}
.dg>div{background:#fff;border-radius:10px;padding:7px 10px;box-shadow:0 1px 4px rgba(29,66,98,.1);font-size:13px;cursor:pointer}
.dg b{display:block;font-size:15px;color:var(--navy)}
.dg .m{grid-template-columns:32px 1fr 74px;margin-top:3px;font-size:12px}.dg .m .v em{font-size:13px}
.note{font-size:12px;color:var(--sub);padding:0 14px 8px;line-height:1.6}
</style>
</head>

      var s = stat(UN[u]);
      return "<div class='u"+(u===sel?" on":"")+(s.a===s.n?" full":"")+"' data-u='"+esc(u)+"'><h3>"+esc(u)+"<span>應到 "+(MD==="pm"?s.pn:s.n)+" 人</span></h3>"+
        (MD!=="pm" ? meter("am", "主場", s.a, s.n) : "") + (MD!=="am" && s.pn ? meter("pm", "論壇", s.p, s.pn) : "") + "</div>";
    }).join("") || "<div class='msg'>找不到單位「"+esc(only)+"」</div>";
    var L = document.getElementById("list");
    if (!sel || !UN[sel]) { L.innerHTML = ""; return; }
    var m = UN[sel].slice();
    if (MD==="pm") m = m.filter(function(p){ return !isDT(p) && !isW(p); });
    var secs;
    if (sel==="全真") {                                   // 全真：依「區」分段
      var DS = {}; m.forEach(function(p){ var d = p[1].split("・")[1] || "未分區"; (DS[d] = DS[d] || []).push(p); });
      secs = Object.keys(DS).sort(function(x, y){ return (x==="未分區") - (y==="未分區") || DS[y].length - DS[x].length; }).map(function(d){ return [d, DS[d], 1]; });
    } else {
      secs = [["點傳師", m.filter(isDT)]].concat(F.filter(function(f){ return f.n!=="點傳師"; }).map(function(f){
        var i = F.indexOf(f); return [f.n+"（"+f.f+"）", m.filter(function(p){ return p[2]===i && !isDT(p) && !isW(p); })]; }))
        .concat([["工作人員", m.filter(isW)]]);
    }
    function key(p){ return MD==="am" ? !!AM[pid(p)] : MD==="pm" ? !!PM[pid(p)] : (AM[pid(p)]?1:0) + (PM[pid(p)]?1:0); }
    var h = "<div class='list'><h2>"+esc(sel)+"　名單"+(MD==="am"?"・主場":MD==="pm"?"・論壇":"")+"<small>未到的排前面</small></h2>";
    if (sel==="全真") h += "<div class='dg'>" + secs.map(function(x){ var st = stat(x[1]);
        return "<div data-d='"+esc(x[0])+"'><b>"+esc(x[0])+"</b>"+(MD!=="pm"?meter("am","主場",st.a,st.n):"")+(MD!=="am"&&st.pn?meter("pm","論壇",st.p,st.pn):"")+"</div>"; }).join("") + "</div>";
    secs.forEach(function(x){
      if (!x[1].length) return;
      var a = x[1].slice().sort(function(p, q){ return key(p) - key(q) || isDT(q) - isDT(p) || String(p[3]).localeCompare(String(q[3]), "zh", {numeric:true}); });
      var st = stat(x[1]), cnt = MD==="pm" ? "論壇 "+st.p+"/"+st.pn : MD==="am" ? "主場 "+st.a+"/"+st.n : "主場 "+st.a+"/"+st.n+(st.pn?"・論壇 "+st.p+"/"+st.pn:"");
      h += "<h4 id='d_"+esc(x[0])+"'>"+esc(x[0])+"　"+x[1].length+" 人　"+cnt+"</h4>" + a.map(function(p){
        var am = AM[pid(p)], pm = PM[pid(p)], noPM = isDT(p) || isW(p);
        var where = x[2] ? (isDT(p) ? "點傳師" : whereOf(p)) : whereOf(p);
        return "<div class='row'><span>"+esc(p[0])+"</span>"+((p[4]&1)?"<span class='lead'>組長</span>":"")+
          "<span class='w'>"+esc(where)+"</span><span class='s'>"+
          (MD!=="pm" ? "<span class='"+(am?"y":"")+"'>主場 "+(am?"✓ "+esc(am):"未到")+"</span>" : "")+
          (noPM || MD==="am" ? "" : "<span class='"+(pm?"y":"")+"'>論壇 "+(pm?"✓ "+esc(pm):"未到")+"</span>")+"</span></div>";
      }).join("");
    });
    L.innerHTML = h + "</div>";
  }
  document.getElementById("chips").addEventListener("click", function(e){
    var c = e.target.getAttribute("data-c"); if (c == null) return; sel = c==="全部" ? null : c; render(); });
  document.getElementById("cards").addEventListener("click", function(e){
    var el = e.target.closest(".u"); if (!el) return; var u = el.getAttribute("data-u");
    sel = (sel===u && !hu()) ? null : u; render();
    if (sel) document.getElementById("list").scrollIntoView({behavior:"smooth"}); });
  document.querySelector(".tot").addEventListener("click", function(e){
    var el = e.target.closest("[data-md]"); if (!el) return; var v = el.getAttribute("data-md");
    MD = MD===v ? "" : v; render(); });
  document.getElementById("list").addEventListener("click", function(e){
    var el = e.target.closest("[data-d]"); if (!el) return;
    var t = document.getElementById("d_" + el.getAttribute("data-d")); if (t) t.scrollIntoView({behavior:"smooth"}); });
  window.addEventListener("hashchange", function(){ sel = hu() || null; render(); });
  function load(){
    fetch(GAS + "?action=list&k=" + encodeURIComponent(K||"") + (TEST?"&test=1":""))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok){ document.getElementById("upd").textContent = "密碼不正確，請確認網址"; return; }
        AM = {}; PM = {}; LOADED = true;
        j.rows.forEach(function(r){ var id = String(r[0]), M = /#pm$/.test(id) ? PM : AM, k = id.replace(/#pm$/,""); if (!M[k]) M[k] = r[1]; });   // 重複的只留最早一筆
        document.getElementById("upd").textContent = "最後更新 " + j.now + "　每 30 秒自動更新";
        render();
      })
      .catch(function(){ document.getElementById("upd").textContent = "網路不穩，稍後自動重試…"; });
  }
  if (!K) { document.getElementById("cards").innerHTML = "<div class='msg'>請使用大會提供的完整網址開啟</div>"; document.getElementById("upd").textContent = ""; }
  else { render(); load(); setInterval(load, 30000); }
})();
</script>
</body>
</html>
